<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SatView · 星图视界</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1f2937;--border:rgba(255,255,255,.08);--accent:#3b82f6;--accent-h:#60a5fa;--text:#e6edf3;--text-muted:#8b949e;--radius:10px;--panel-w:320px;--header-h:52px}
html,body{height:100%;font-family:'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:rgba(13,17,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:1100}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:17px;font-weight:600;color:var(--text);letter-spacing:.3px}
.logo-sub{font-size:11px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase}
.header-spacer{flex:1}
.header-badge{font-size:11px;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px}
#map{position:fixed;top:var(--header-h);left:0;right:0;bottom:0;z-index:0}
.leaflet-container{background:#0d1117}
#panel-toggle{position:fixed;top:calc(var(--header-h) + 12px);right:calc(var(--panel-w) + 12px);z-index:1050;width:36px;height:36px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
#panel-toggle:hover{color:var(--text);border-color:var(--accent)}
#panel-toggle.collapsed{right:12px}
#panel{position:fixed;top:var(--header-h);right:0;width:var(--panel-w);bottom:0;background:rgba(22,27,34,.96);backdrop-filter:blur(16px);border-left:1px solid var(--border);z-index:1000;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.4,0,.2,1);overflow:hidden}
#panel.collapsed{transform:translateX(100%)}
.panel-head{padding:18px;border-bottom:1px solid var(--border)}
.panel-title{font-size:15px;font-weight:600;margin-bottom:6px}
.panel-desc{font-size:12px;line-height:1.5;color:var(--text-muted)}
.panel-body{flex:1;overflow:auto;padding:18px}
.group{margin-bottom:18px}
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:8px}
select,input[type=range]{width:100%}
select{height:36px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0 10px;outline:0}
select:focus{border-color:var(--accent)}
.range-row{display:flex;align-items:center;gap:10px}
.range-row span{width:42px;text-align:right;font-size:12px;color:var(--text-muted)}
input[type=range]{accent-color:var(--accent)}
.btn{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--accent);color:white;cursor:pointer;font-size:13px}
.btn:hover{background:var(--accent-h)}
.btn.secondary{background:var(--surface2);color:var(--text)}
.btn.secondary:hover{border-color:var(--accent)}
.info{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius);padding:12px;font-size:12px;line-height:1.6;color:var(--text-muted)}
.legend{position:fixed;left:16px;bottom:16px;z-index:900;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:26px;padding:10px 14px;min-width:680px;max-width:1100px;box-shadow:0 6px 24px rgba(0,0,0,.12);color:#111}
.legend-row{display:flex;align-items:center;gap:14px;width:100%}
.legend-title{font-size:16px;font-weight:800;white-space:nowrap;color:#111;line-height:1;flex:0 0 auto;margin:0}
.legend-bar-wrap{position:relative;flex:1;height:26px}
.legend-bar{height:26px;border-radius:999px;width:100%}
.legend-labels{position:absolute;left:0;right:0;top:0;height:34px;pointer-events:none}
.legend-labels span{position:absolute;top:40%;transform:translate(-50%,-50%);color:#fff;font-size:14px;line-height:1;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.72);white-space:nowrap}
.status{position:fixed;left:16px;top:calc(var(--header-h) + 16px);z-index:900;background:rgba(22,27,34,.94);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-muted);max-width:420px}
.visit-float{position:fixed;left:16px;bottom:calc(16px + 44px);z-index:950;background:rgba(22,27,34,.92);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text-muted);backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.leaflet-control-attribution{background:rgba(22,27,34,.85)!important;color:var(--text-muted)!important}
.leaflet-control-attribution a{color:var(--accent-h)!important}
.time-wrap{display:flex;flex-direction:column;gap:6px}
#time-slider{width:100%;height:24px;appearance:none;-webkit-appearance:none;background:transparent}
#time-slider::-webkit-slider-runnable-track{height:6px;background:#e5e7eb;border-radius:999px}
#time-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6px;border:2px solid #fff;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
#time-slider::-moz-range-track{height:6px;background:#e5e7eb;border-radius:999px}
#time-slider::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--accent)}
.time-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);padding:0 2px}
@media(max-width:720px){:root{--panel-w:86vw}.header-badge{display:none}.logo-sub{display:none}.legend{min-width:260px;max-width:92vw}.visit-float{display:none}}
</style>
</head>
<body>
<header>
<a class="logo" href="./">
<div class="logo-icon">🛰️</div>
<div><div class="logo-text">SatView</div><div class="logo-sub">Remote Sensing Viewer</div></div>
</a>
<div class="header-spacer"></div>
<div class="header-badge" id="updated">Loading</div>
</header>

<div id="map"></div>
<button id="panel-toggle">›</button>

<aside id="panel">
<div class="panel-head">
<div class="panel-title">产品控制</div>
<div class="panel-desc" id="product-desc">读取 products.json 中...</div>
</div>
<div class="panel-body">
<div class="group"><label>遥感产品</label><select id="product"></select></div>
<div class="group"><label>日期</label><select id="date"></select></div>
<div class="group"><label>小时</label><select id="hour"></select></div>
<div class="group"><label>时间轴</label><div class="time-wrap"><input id="time-slider" type="range" min="0" max="23" value="0"><div class="time-labels"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div></div>
<div class="group"><button class="btn secondary" id="play">播放</button></div>
<div class="group"><label>图层透明度</label><div class="range-row"><input id="opacity" type="range" min="0" max="100" value="80"><span id="opacity-val">80%</span></div></div>
<div class="group"><label>矢量图层</label><button class="btn secondary" id="toggle-countries">国界开关：开</button></div>
<div class="group"><button class="btn secondary" id="toggle-layer">数据开关：开</button></div>
<div class="group"><label>站点观测</label><button class="btn secondary" id="toggle-meas">观测开关：开</button></div>
<div class="group"><button class="btn secondary" id="load-meas">加载观测</button></div>
<div class="group"><button class="btn" id="download">下载原图</button></div>
<div class="group"><button class="btn secondary" id="fit">缩放到图层</button></div>
<div class="info" id="info">等待加载...</div>
</div>
</aside>

<div class="status" id="status">正在加载配置...</div>
<div class="visit-float" id="visit-float">访问统计加载中...</div>

<div class="legend" id="legend" style="display:none">
  <div class="legend-row">
    <div class="legend-title" id="legend-title"></div>
    <div class="legend-bar-wrap">
      <div class="legend-bar" id="legend-bar"></div>
      <div class="legend-labels" id="legend-labels"></div>
    </div>
  </div>
</div>

<script>
let cfg,products=[],current,overlay,map,countryLayer,showCountries=true,layerVisible=true,timer=null,playing=false,measLayer=null,showMeas=true,measCache={},stationsCache=null
const $=id=>document.getElementById(id)
const status=t=>$('status').textContent=t
const hours24=[...Array(24)].map((_,i)=>'H'+String(i).padStart(2,'0'))
const urlOf=(p,d,h)=>p?.url_template&&d&&h?p.url_template.replaceAll('{date}',d).replaceAll('{hour}',h):''
const vf=$('visit-float')
function fmtTime(t){return new Date(t).toLocaleString('zh-CN',{hour12:false})}
function loadVisits(){
const k='satview_visits'
let v=JSON.parse(localStorage.getItem(k)||'{"count":0,"last":""}')
v.count++
v.last=new Date().toISOString()
localStorage.setItem(k,JSON.stringify(v))
vf.textContent=`访问次数：${v.count}｜最近访问：${fmtTime(v.last)}`
}
function pmColor(v){
if(v==null||isNaN(v))return '#999'
const cs=[[0,[49,54,149]],[10,[74,123,183]],[20,[128,183,214]],[35,[189,226,238]],[50,[238,248,223]],[60,[254,238,165]],[70,[253,191,113]],[80,[246,123,74]],[90,[218,55,42]],[100,[165,0,38]]]
if(v<=cs[0][0])return `rgb(${cs[0][1].join(',')})`
for(let i=1;i<cs.length;i++){
if(v<=cs[i][0]){
const [x0,c0]=cs[i-1],[x1,c1]=cs[i]
const t=(v-x0)/(x1-x0)
const c=c0.map((a,j)=>Math.round(a+(c1[j]-a)*t))
return `rgb(${c.join(',')})`
}}
return `rgb(${cs.at(-1)[1].join(',')})`
}

map=L.map('map',{worldCopyJump:true,zoomControl:true}).setView([25,105],3)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:8,minZoom:2,attribution:'&copy; OpenStreetMap'}).addTo(map)

async function loadCountries(){
try{
const u='https://raw.githubusercontent.com/fanyulong-rs/SatView/main/Countries.geojson?ts='+Date.now()
const r=await fetch(u)
if(!r.ok)throw new Error('Countries.geojson 读取失败：HTTP '+r.status)
const data=await r.json()
countryLayer=L.geoJSON(data,{style:{color:'#ffffff',weight:1,opacity:.7,fill:false,interactive:false}})
if(showCountries)countryLayer.addTo(map)
syncCountryButton()
}catch(e){
console.warn(e)
status('国界加载失败，主图不受影响')
}
}

function syncCountryButton(){
$('toggle-countries').textContent='国界开关：'+(showCountries?'开':'关')
}

async function init(){
try{
const r=await fetch('./products.json?ts='+Date.now())
if(!r.ok)throw new Error('products.json 读取失败：HTTP '+r.status)
cfg=await r.json()
products=cfg.products||[]
if(!products.length)throw new Error('products.json 中 products 为空')
$('updated').textContent='Updated '+(cfg.updated_at||'')
fillProducts()
const def=products.find(p=>p.id===cfg.default_product)||products[0]
$('product').value=def.id
await loadCountries()
selectProduct(def.id)
status('配置加载完成')
}catch(e){
console.error(e)
status(e.message)
$('product-desc').textContent=e.message
}
}

function fillProducts(){
$('product').innerHTML=products.map(p=>`<option value="${p.id}">${p.name||p.id}</option>`).join('')
}

function selectProduct(id){
current=products.find(p=>p.id===id)||products[0]
if(!current)return
$('product-desc').innerHTML=current.description||''
$('date').innerHTML=(current.dates||[]).map(d=>`<option value="${d}">${d}</option>`).join('')
$('date').value=(current.dates&&current.dates[0])||''
$('hour').innerHTML=(current.hours&&current.hours.length?current.hours:hours24).map(h=>`<option value="${h}">${h}</option>`).join('')
const h=current.default_hour&&($('hour').querySelector(`option[value="${current.default_hour}"]`))?current.default_hour:($('hour').value||'H00')
$('hour').value=h
$('time-slider').value=hours24.indexOf(h)
updateLegend()
loadStations().then(()=>{updateLayer(true);loadMeas()})
}

function setHourByIndex(i){
i=(i+24)%24
const h=hours24[i]
$('time-slider').value=i
$('hour').value=h
updateLayer(false)
if(measCache[$('date').value])drawMeas(measCache[$('date').value])
}

function updateLayer(fit=false){
if(!current)return
if(!layerVisible){if(overlay)map.removeLayer(overlay);return}
const d=$('date').value,h=$('hour').value
if(!d||!h){status('缺少日期或小时，无法加载图层');return}
const u=urlOf(current,d,h)
if(!u){status('URL 无效');return}
const op=+$('opacity').value/100
if(overlay)map.removeLayer(overlay)
overlay=L.imageOverlay(u,current.bounds,{opacity:op,interactive:false}).addTo(map)
overlay.on('error',()=>status('图像加载失败：'+u))
if(fit&&current.bounds)map.fitBounds(current.bounds)
$('info').innerHTML=`Date: ${d} ${h}`
}

function updateLegend(){
const l=current?.legend
if(!l){$('legend').style.display='none';return}
$('legend').style.display='block'
$('legend-title').innerHTML=(l.title||current.name||current.id)+(l.unit?' '+l.unit:'')
$('legend-bar').style.background='linear-gradient(to right,'+(l.colors||[]).join(',')+')'
const labels=l.labels||[]
$('legend-labels').innerHTML=labels.map((x,i)=>`<span style="left:${(i+1)*10}%">${x}</span>`).join('')
}

async function loadStations(){
if(stationsCache||!current||!current.stations_url)return
try{
const r=await fetch(current.stations_url+'?ts='+Date.now())
if(!r.ok)throw new Error('站点读取失败：HTTP '+r.status)
stationsCache=await r.json()
}catch(e){
console.error(e)
status(e.message)
}
}

function normalizeRecords(data){
if(Array.isArray(data))return data
if(Array.isArray(data.records))return data.records
return []
}

async function loadMeas(){
if(!current)return
const d=$('date').value
if(!d)return
if(measCache[d]){drawMeas(measCache[d]);return}
try{
const u=current.meas_template
if(!u)return
const r=await fetch(u.replaceAll('{date}',d)+'?ts='+Date.now())
if(!r.ok)throw new Error('观测读取失败：HTTP '+r.status)
const data=await r.json()
measCache[d]=data
drawMeas(data)
}catch(e){
console.error(e)
status(e.message)
}
}

function drawMeas(data){
if(measLayer)map.removeLayer(measLayer)
if(!showMeas||!data){measLayer=null;return}
const records=normalizeRecords(data)
const stmap=new Map((stationsCache?normalizeRecords(stationsCache):[]).map(s=>[s.Site||s.site||s.id,s]))
const h=$('hour').value
const use=records.map(x=>{
const s=stmap.get(x.Site||x.site||x.id)||{}
const lat=+(s.Lat??s.lat??s.latitude??s.Latitude)
const lon=+(s.Lon??s.lon??s.lng??s.longitude??s.Longitude)
const v=+(x.PM2p5??x.value??x.val)
if(!isFinite(lat)||!isFinite(lon)||!isFinite(v))return null
if(x.Date!=null&&getHourFromDate(x.Date)!==h)return null
return {lat,lon,v,x}
}).filter(Boolean)
measLayer=L.layerGroup(use.map(o=>L.circleMarker([o.lat,o.lon],{radius:Math.max(3,Math.min(10,2+Math.sqrt(o.v||0))),color:'#fff',weight:1,fillColor:pmColor(o.v),fillOpacity:.9}).bindPopup(`Site: ${o.x.Site||o.x.site||o.x.id||''}<br>PM2.5: ${o.v}<br>Date: ${o.x.Date?new Date(o.x.Date).toLocaleString('zh-CN',{hour12:false}):''}`))).addTo(map)
$('info').innerHTML=`Date: ${$('date').value} ${h}<br>观测: ${use.length} 个点`
}

function stopPlay(){
playing=false
if(timer){clearInterval(timer);timer=null}
$('play').textContent='播放'
}

loadVisits()

$('product').onchange=e=>{stopPlay();stationsCache=null;measCache={};selectProduct(e.target.value)}
$('date').onchange=()=>{updateLayer(true);loadMeas()}
$('hour').onchange=()=>{
const i=hours24.indexOf($('hour').value)
if(i>=0)$('time-slider').value=i
updateLayer(false)
if(measCache[$('date').value])drawMeas(measCache[$('date').value])
}
$('time-slider').oninput=e=>setHourByIndex(+e.target.value)
$('play').onclick=()=>{
playing=!playing
$('play').textContent=playing?'暂停':'播放'
if(timer){clearInterval(timer);timer=null}
if(playing)timer=setInterval(()=>{let i=(+$('time-slider').value+1)%24;setHourByIndex(i)},800)
}
$('opacity').oninput=e=>{
$('opacity-val').textContent=e.target.value+'%'
if(overlay)overlay.setOpacity(+e.target.value/100)
}
$('download').onclick=()=>{
if(!current)return status('没有可下载的图层')
const d=$('date').value,h=$('hour').value,u=urlOf(current,d,h)
if(!u)return status('缺少下载地址')
const a=document.createElement('a')
a.href=u
a.download=u.split('/').pop()
a.click()
}
$('fit').onclick=()=>current&&current.bounds&&map.fitBounds(current.bounds)
$('panel-toggle').onclick=()=>{
$('panel').classList.toggle('collapsed')
$('panel-toggle').classList.toggle('collapsed')
$('panel-toggle').textContent=$('panel').classList.contains('collapsed')?'‹':'›'
setTimeout(()=>map.invalidateSize(),260)
}
$('toggle-countries').onclick=()=>{
showCountries=!showCountries
if(countryLayer){
if(showCountries)countryLayer.addTo(map)
else map.removeLayer(countryLayer)
}
syncCountryButton()
}
$('toggle-layer').onclick=()=>{
layerVisible=!layerVisible
$('toggle-layer').textContent='数据开关：'+(layerVisible?'开':'关')
if(!layerVisible&&overlay)map.removeLayer(overlay)
else updateLayer(false)
}
$('toggle-meas').onclick=()=>{
showMeas=!showMeas
$('toggle-meas').textContent='观测开关：'+(showMeas?'开':'关')
if(showMeas){
if(measCache[$('date').value])drawMeas(measCache[$('date').value]);else loadMeas()
}else if(measLayer)map.removeLayer(measLayer)
}
$('load-meas').onclick=loadMeas

init()
</script>
</body>
</html>
