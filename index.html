<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SatView · 星图视界</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1f2937;--border:rgba(255,255,255,.08);--accent:#3b82f6;--accent-h:#60a5fa;--text:#e6edf3;--text-muted:#8b949e;--radius:10px;--panel-w:300px;--header-h:52px}
html,body{height:100%;font-family:'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:rgba(13,17,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:1100}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:17px;font-weight:600;color:var(--text);letter-spacing:.3px}
.logo-sub{font-size:11px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase}
.header-spacer{flex:1}
.header-badge{font-size:11px;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px}
#map{position:fixed;top:var(--header-h);left:0;right:0;bottom:0;z-index:0}
.leaflet-container{background:#0d1117}
#panel-toggle{position:fixed;top:calc(var(--header-h) + 12px);right:calc(var(--panel-w) + 12px);z-index:1050;width:36px;height:36px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
#panel-toggle:hover{color:var(--text);border-color:var(--accent)}
#panel-toggle.collapsed{right:12px}
#panel{position:fixed;top:var(--header-h);right:0;width:var(--panel-w);bottom:0;background:rgba(22,27,34,.96);backdrop-filter:blur(16px);border-left:1px solid var(--border);z-index:1000;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.4,0,.2,1);overflow:hidden}
#panel.collapsed{transform:translateX(100%)}
.panel-head{padding:18px;border-bottom:1px solid var(--border)}
.panel-title{font-size:15px;font-weight:600;margin-bottom:6px}
.panel-desc{font-size:12px;line-height:1.5;color:var(--text-muted)}
.panel-body{flex:1;overflow:auto;padding:18px}
.group{margin-bottom:18px}
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:8px}
select,input[type=range]{width:100%}
select{height:36px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0 10px;outline:0}
select:focus{border-color:var(--accent)}
.range-row{display:flex;align-items:center;gap:10px}
.range-row span{width:42px;text-align:right;font-size:12px;color:var(--text-muted)}
input[type=range]{accent-color:var(--accent)}
.btn{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--accent);color:white;cursor:pointer;font-size:13px}
.btn:hover{background:var(--accent-h)}
.btn.secondary{background:var(--surface2);color:var(--text)}
.btn.secondary:hover{border-color:var(--accent)}
.info{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius);padding:12px;font-size:12px;line-height:1.6;color:var(--text-muted)}
.legend{position:fixed;left:16px;bottom:16px;z-index:900;background:rgba(22,27,34,.94);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-width:220px}
.legend-title{font-size:13px;font-weight:600;margin-bottom:8px}
.legend-bar-wrap{position:relative;height:18px;margin-bottom:8px}
.legend-bar{height:12px;border-radius:999px}
.legend-labels{position:absolute;left:0;right:0;top:0;height:12px;pointer-events:none}
.legend-labels span{position:absolute;transform:translateX(-50%);color:#fff;font-size:10px;line-height:12px;text-shadow:0 1px 2px rgba(0,0,0,.85);white-space:nowrap}
.legend-note{font-size:11px;color:var(--text-muted);line-height:1.4;margin-top:8px}
.status{position:fixed;left:16px;top:calc(var(--header-h) + 16px);z-index:900;background:rgba(22,27,34,.94);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-muted);max-width:420px}
.leaflet-control-attribution{background:rgba(22,27,34,.85)!important;color:var(--text-muted)!important}
.leaflet-control-attribution a{color:var(--accent-h)!important}
.time-wrap{display:flex;flex-direction:column;gap:6px}
#time-slider{width:100%;height:24px;appearance:none;-webkit-appearance:none;background:transparent}
#time-slider::-webkit-slider-runnable-track{height:6px;background:#e5e7eb;border-radius:999px}
#time-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6px;border:2px solid #fff;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
#time-slider::-moz-range-track{height:6px;background:#e5e7eb;border-radius:999px}
#time-slider::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--accent)}
.time-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);padding:0 2px}
@media(max-width:720px){:root{--panel-w:86vw}.header-badge{display:none}.logo-sub{display:none}}
</style>
</head>
<body>
<header>
<a class="logo" href="./">
<div class="logo-icon">🛰️</div>
<div>
<div class="logo-text">SatView</div>
<div class="logo-sub">Remote Sensing Viewer</div>
</div>
</a>
<div class="header-spacer"></div>
<div class="header-badge" id="updated">Loading</div>
</header>

<div id="map"></div>
<button id="panel-toggle">›</button>

<aside id="panel">
<div class="panel-head">
<div class="panel-title">产品控制</div>
<div class="panel-desc" id="product-desc">读取 products.json 中...</div>
</div>
<div class="panel-body">
<div class="group">
<label>遥感产品</label>
<select id="product"></select>
</div>
<div class="group">
<label>日期</label>
<select id="date"></select>
</div>
<div class="group">
<label>小时</label>
<select id="hour"></select>
</div>
<div class="group">
<label>时间轴</label>
<div class="time-wrap">
<input id="time-slider" type="range" min="0" max="23" value="0">
<div class="time-labels"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
</div>
</div>
<div class="group">
<button class="btn secondary" id="play">播放</button>
</div>
<div class="group">
<label>图层透明度</label>
<div class="range-row">
<input id="opacity" type="range" min="0" max="100" value="80">
<span id="opacity-val">80%</span>
</div>
</div>
<div class="group">
<label>矢量图层</label>
<button class="btn secondary" id="toggle-countries">国界开关：开</button>
</div>
<div class="group">
<button class="btn" id="download">下载原图</button>
</div>
<div class="group">
<button class="btn secondary" id="fit">缩放到图层</button>
</div>
<div class="info" id="info">等待加载...</div>
</div>
</aside>

<div class="status" id="status">正在加载配置...</div>

<div class="legend" id="legend" style="display:none">
<div class="legend-title" id="legend-title"></div>
<div class="legend-bar-wrap">
<div class="legend-bar" id="legend-bar"></div>
<div class="legend-labels" id="legend-labels"></div>
</div>
<div class="legend-note" id="legend-note"></div>
</div>

<script>
let cfg,products=[],current,overlay,map,countryLayer,showCountries=true,timer=null,playing=false
const $=id=>document.getElementById(id)
const status=t=>$('status').textContent=t
const urlOf=(p,d,h)=>p.url_template.replaceAll('{date}',d).replaceAll('{hour}',h)
const hours24=[...Array(24)].map((_,i)=>'H'+String(i).padStart(2,'0'))

map=L.map('map',{worldCopyJump:true,zoomControl:true}).setView([25,105],3)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:8,minZoom:2,attribution:'&copy; OpenStreetMap'}).addTo(map)

async function loadCountries(){
try{
const u='https://raw.githubusercontent.com/fanyulong-rs/SatView/main/Countries.geojson?ts='+Date.now()
const r=await fetch(u)
if(!r.ok)throw new Error('Countries.geojson 读取失败：HTTP '+r.status)
countryLayer=L.geoJSON(await r.json(),{style:{color:'#ffffff',weight:1,opacity:.7,fill:false,interactive:false}}).addTo(map)
}catch(e){
console.warn(e)
status('国界加载失败，主图不受影响')
}
}

async function init(){
try{
const r=await fetch('./products.json?ts='+Date.now())
if(!r.ok)throw new Error('products.json 读取失败：HTTP '+r.status)
cfg=await r.json()
products=cfg.products||[]
if(!products.length)throw new Error('products.json 中 products 为空')
$('updated').textContent='Updated '+(cfg.updated_at||'')
fillProducts()
const def=products.find(p=>p.id===cfg.default_product)||products[0]
$('product').value=def.id
selectProduct(def.id)
await loadCountries()
status('配置加载完成')
}catch(e){
console.error(e)
status(e.message)
$('product-desc').textContent=e.message
}
}

function fillProducts(){
$('product').innerHTML=products.map(p=>`<option value="${p.id}">${p.name||p.id}</option>`).join('')
}

function selectProduct(id){
current=products.find(p=>p.id===id)||products[0]
$('product-desc').textContent=current.description||''
$('date').innerHTML=(current.dates||[]).map(d=>`<option value="${d}">${d}</option>`).join('')
$('date').value=(current.dates&&current.dates[0])||''
$('hour').innerHTML=hours24.map(h=>`<option value="${h}">${h}</option>`).join('')
const h=current.default_hour&&hours24.includes(current.default_hour)?current.default_hour:'H00'
$('hour').value=h
$('time-slider').value=hours24.indexOf(h)
updateLayer()
updateLegend()
}

function setHourByIndex(i){
i=(i+24)%24
const h=hours24[i]
$('time-slider').value=i
$('hour').value=h
updateLayer()
}

function updateLayer(){
if(!current)return
const d=$('date').value,h=$('hour').value,u=urlOf(current,d,h),op=+$('opacity').value/100
if(overlay)map.removeLayer(overlay)
overlay=L.imageOverlay(u,current.bounds,{opacity:op,interactive:false}).addTo(map)
overlay.on('load',()=>status('图层已加载：'+u))
overlay.on('error',()=>status('图像加载失败：'+u))
map.fitBounds(current.bounds)
$('info').innerHTML=`Date: ${d} ${h}`
}

function updateLegend(){
const l=current?.legend
if(!l){$('legend').style.display='none';return}
$('legend').style.display='block'
$('legend-title').textContent=(l.title||current.name||current.id)+(l.unit?' / '+l.unit:'')
$('legend-bar').style.background='linear-gradient(to right,rgb(49,54,149),rgb(74,123,183),rgb(128,183,214),rgb(189,226,238),rgb(238,248,223),rgb(254,238,165),rgb(253,191,113),rgb(246,123,74),rgb(218,55,42),rgb(165,0,38))'
$('legend-labels').innerHTML=(l.labels||[]).map((x,i,a)=>`<span style="left:${a.length===1?50:i*100/(a.length-1)}%">${x}</span>`).join('')
}

function stopPlay(){
playing=false
if(timer){clearInterval(timer);timer=null}
$('play').textContent='播放'
}

$('product').onchange=e=>selectProduct(e.target.value)
$('date').onchange=()=>updateLayer()
$('hour').onchange=()=>{
const i=hours24.indexOf($('hour').value)
if(i>=0)$('time-slider').value=i
updateLayer()
}
$('time-slider').oninput=e=>setHourByIndex(+e.target.value)
$('play').onclick=()=>{
playing=!playing
$('play').textContent=playing?'暂停':'播放'
if(timer){clearInterval(timer);timer=null}
if(playing)timer=setInterval(()=>{let i=(+$('time-slider').value+1)%24;setHourByIndex(i)},800)
}
$('opacity').oninput=e=>{
$('opacity-val').textContent=e.target.value+'%'
if(overlay)overlay.setOpacity(+e.target.value/100)
}
$('download').onclick=()=>{
if(!current)return
const a=document.createElement('a')
a.href=urlOf(current,$('date').value,$('hour').value)
a.download=a.href.split('/').pop()
a.click()
}
$('fit').onclick=()=>current&&map.fitBounds(current.bounds)
$('panel-toggle').onclick=()=>{
$('panel').classList.toggle('collapsed')
$('panel-toggle').classList.toggle('collapsed')
$('panel-toggle').textContent=$('panel').classList.contains('collapsed')?'‹':'›'
setTimeout(()=>map.invalidateSize(),260)
}
$('toggle-countries').onclick=()=>{
showCountries=!showCountries
if(countryLayer){
if(showCountries)countryLayer.addTo(map)
else map.removeLayer(countryLayer)
}
$('toggle-countries').textContent='国界开关：'+(showCountries?'开':'关')
}

init()
</script>
</body>
</html>
